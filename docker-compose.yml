# astrx-suite — one-command Tor deployment (Rust engines).
#
#   cp deploy/.env.example .env      # optional: roles / image tag
#   docker compose up -d             # builds + starts the published stack
#   docker compose exec tor sh -c 'cat /var/lib/tor/*/hostname'   # your .onions
#
# PRIVACY POSTURE
#   * No app port is published to the host — there is NO `ports:` mapping
#     anywhere below. The only ingress is Tor, which reaches each service over
#     an INTERNAL Docker network that has no route to the host or the internet.
#   * `tor` is dual-homed: the `internal` network (to reach the app container
#     and to offer SOCKS to the onion crawler) and the `egress` network (so Tor
#     — and only Tor and the opt-in clearnet crawlers — can reach the outside
#     world).
#   * Each engine keeps its database / repos in a named volume, and Tor keeps
#     its hidden-service keys in `tor-keys`, so the generated .onion addresses
#     are STABLE across restarts.
#
# THREE CONTAINERS, ONE PER NETWORK
#   Every role runs from one image (`suite`: the single `astrx` binary, alpine
#   + git for gitweb) under `astrx run`, which starts each role as a child of
#   that binary, prefixes its log lines with [role], and restarts a role that
#   exits without touching the others. Roles are grouped by what they may
#   reach, so the network boundaries are the same as with one container each:
#
#     serve   internal only   gitweb, the three search front-ends, the tracker,
#                             the dashboard — and the onion crawler, whose only
#                             way out is Tor's SOCKS port on this network
#     crawl   egress only     the clearnet crawler and the DHT harvester
#     tor     both
#
#   `serve` answers on the names the services had as separate containers
#   (gitweb, websearch-serve, …), so deploy/torrc and anything else that
#   addressed them need no change.
#
# WHICH ROLES RUN
#   ASTRX_SERVE_ROLES and ASTRX_CRAWL_ROLES (see deploy/.env.example) list the
#   roles each container runs, out of the ones its `command` defines. The
#   `crawl` container starts only with COMPOSE_PROFILES=crawl.
#
# STOPPING
#   `init: true` puts Docker's init in front of `astrx run`, so a stop signal
#   reaches every role (the engines have no signal handlers of their own; as
#   PID 1 they would ignore it until Docker's kill timeout).

name: astrx-suite

# --- shared config for the suite containers ---------------------------------
x-suite: &suite
  build:
    context: .
    dockerfile: deploy/Dockerfile
    target: suite
  image: astrx/suite:${IMAGE_TAG:-latest}
  init: true
  restart: unless-stopped
  # Hardening: the engines are static binaries serving HTTP and crawling;
  # they need no Linux capabilities and must never gain privileges.
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  read_only: true

networks:
  # No route to the host or the internet. Tor bridges into it for ingress.
  # The subnet is pinned because deploy/torrc's SocksPolicy allows exactly this
  # CIDR to use SOCKS and rejects the egress bridge + host. Keep the two in sync.
  internal:
    internal: true
    ipam:
      config:
        - subnet: 10.63.0.0/24
  # Outbound-only bridge for Tor's own traffic and the opt-in clearnet crawlers.
  egress:
    driver: bridge

volumes:
  gitweb-repos:        # git repositories served read-only by gitweb
  onioncrawler-data:   # onioncrawler crawl.db (+ seeds/blocklists)
  websearch-data:      # websearch web.db (+ seeds)
  torrentds-data:      # torrentds torrentds.db (+ tracker peer store)
  tor-keys:            # /var/lib/tor — hidden-service keys => STABLE .onions

services:
  # --------------------------------------------------------------- serve ---
  serve:
    <<: *suite
    networks:
      internal:
        # The names these services had as separate containers.
        aliases:
          - gitweb
          - onioncrawler-search
          - websearch-serve
          - torrentds-search
          - torrentds-tracker
          - suitedash
    environment:
      ASTRX_ROLES: ${ASTRX_SERVE_ROLES:-gitweb,onion-search,web-search,torrent-search,dash}
    # One role per item: name=engine args… (quoted like a shell, never run by one).
    command:
      - run
      - gitweb=gitweb --root /repos --host 0.0.0.0 --port 8801 --quiet --auth '${GITWEB_AUTH:-}'
      - onion-search=onioncrawler search --db /data/onion/crawl.db --host 0.0.0.0 --port 8802
      # The darknet crawler. Its ONLY route out is Tor's SOCKS port on the
      # internal network — this container is not attached to `egress`, so a
      # bug cannot leak a clearnet request.
      - onion-crawl=onioncrawler crawl --db /data/onion/crawl.db --seeds /data/onion/seeds.txt --tor-host tor --tor-port 9050
      - web-search=websearch serve --db /data/web/web.db --host 0.0.0.0 --port 8803
      - torrent-search=torrentds search --db /data/torrent/torrentds.db --host 0.0.0.0 --port 8804
      # The BitTorrent trackers (HTTP published via Tor; UDP is LAN/egress
      # only, since v3 onions are TCP-only).
      - tracker=torrentds tracker --db /data/torrent/torrentds.db --host 0.0.0.0 --http-port 8805
      # The status dashboard: polls the roles above, next to it.
      - dash=suitedash --host 0.0.0.0 --port 8806 --service gitweb=http://127.0.0.1:8801 --service onioncrawler=http://127.0.0.1:8802 --service websearch=http://127.0.0.1:8803 --service torrentds=http://127.0.0.1:8804
    volumes:
      - gitweb-repos:/repos
      - onioncrawler-data:/data/onion
      - websearch-data:/data/web
      - torrentds-data:/data/torrent
    expose: ["8801", "8802", "8803", "8804", "8805", "8806"]
    # The dashboard's own probe: non-zero when a front-end is down. (It checks
    # the default roles; adjust it if you turn one of them off.)
    healthcheck:
      test: ["CMD", "/usr/local/bin/astrx", "suitedash", "--check", "--quiet",
             "--service", "gitweb=http://127.0.0.1:8801",
             "--service", "onioncrawler=http://127.0.0.1:8802",
             "--service", "websearch=http://127.0.0.1:8803",
             "--service", "torrentds=http://127.0.0.1:8804"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # --------------------------------------------------------------- crawl ---
  # The crawlers that need real egress. Start it with COMPOSE_PROFILES=crawl.
  crawl:
    <<: *suite
    profiles: ["crawl"]
    networks: [egress]
    environment:
      ASTRX_ROLES: ${ASTRX_CRAWL_ROLES:-web-crawl,dht-index}
    command:
      - run
      - web-crawl=websearch crawl --db /data/web/web.db --seeds /data/web/seeds.txt --broad
      # UDP to the global DHT.
      - dht-index=torrentds index --db /data/torrent/torrentds.db
    volumes:
      - websearch-data:/data/web
      - torrentds-data:/data/torrent

  # ------------------------------------------------------------------ tor ---
  tor:
    build:
      context: ./deploy
      dockerfile: Dockerfile.tor
    image: astrx/tor:${IMAGE_TAG:-latest}
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    volumes:
      - tor-keys:/var/lib/tor
    # Dual-homed: `internal` to reach the app container and offer SOCKS to the
    # onion crawler; `egress` so Tor itself can reach the network.
    networks: [internal, egress]
    depends_on: [serve]
