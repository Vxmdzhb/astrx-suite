[package]
name = "astrx-split"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
publish = false
description = "Splits the astrx-suite workspace into one repository per crate, keeping each file's history."

# Standard library only, like the suite. Not a workspace member: it is a
# one-off maintenance tool, run with
#     cargo run --manifest-path tools/split/Cargo.toml -- --help
[dependencies]

[[bin]]
name = "astrx-split"
path = "src/main.rs"
