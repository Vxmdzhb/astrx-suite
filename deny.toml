# ─────────────────────────────────────────────────────────────────────────────
# cargo-deny configuration for the astrx-suite Rust workspace.
#
#   cargo deny check                 # run all checks below
#   cargo deny check advisories      # just the RustSec audit
#   cargo deny check bans licenses   # just the supply-chain / licence gates
#
# The supply-chain side of CI (.github/workflows/ci.yml): CI proves the
# default build has no dependencies, and cargo-deny governs the few vetted
# crates the opt-in `rand` / `net` features may add (tokio, getrandom and
# their small transitive closure). It runs on all features, so those crates
# are in the graph it audits.
# ─────────────────────────────────────────────────────────────────────────────

[graph]
# Audit all features: the default build uses only the standard library, so
# there would be nothing to check.
all-features = true

# ── Security advisories (RustSec) ────────────────────────────────────────────
# Vulnerabilities and unsound advisories are always errors under `version = 2`
# (silence a specific one, with justification, by adding its RUSTSEC id to
# `ignore`). We additionally treat unmaintained crates and yanked releases as
# hard failures — a tiny dependency set is only worth it if every crate in it is
# alive and pinned to a published, non-withdrawn version.
[advisories]
version = 2
db-urls = ["https://github.com/rustsec/advisory-db"]
unmaintained = "all"
yanked = "deny"
ignore = [
  # "RUSTSEC-0000-0000",  # <justification, owner, review date>
]

# ── Licences ─────────────────────────────────────────────────────────────────
# Permissive only, and exactly the four licences the closure contains: MIT /
# Apache-2.0 for the dual-licensed crates, Unicode-3.0 for `unicode-ident`,
# and the LLVM-exception Apache variant for `wasi`.
#
# Nothing else is pre-approved. Admitting a new licence should be a
# deliberate, reviewed decision, like admitting a new crate: a dependency
# under any other licence fails here, names it, and asks a human. (Unused
# allowances would also print a warning on every run.)
[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-3.0",
  "LicenseRef-DoWhatever",  # the AstrX crates themselves (see LICENSE)
]
exceptions = [
  # { name = "some-crate", allow = ["SomeOtherLicense"] },
]

# ── Bans: keep the dependency set tiny and single-versioned ─────────────────
# The wire core has no third-party dependencies, and the live node adds two
# vetted crates. With --all-features, the whole allowed runtime closure is:
#
#     tokio            async runtime          (net feature)
#     getrandom        CSPRNG                 (rand feature)
#     └─ transitively:  libc, mio, socket2, bytes, pin-project-lite, cfg-if,
#                       wasi, windows-sys/windows-link (platform shims), and the
#                       build-time proc-macro trio proc-macro2 / quote / syn
#                       (+ tokio-macros, unicode-ident).
#
# `multiple-versions` and `wildcards` keep that closure small and exact; the
# `deny` list below blocks the heavy crates we never want, so adding a TLS or
# crypto stack or an in-process libgit2 (gitweb only ever runs the git
# binary) fails in review.
[bans]
multiple-versions = "deny"
wildcards = "deny"

# `wildcards` exists to stop `foo = "*"` against a REGISTRY crate, where it means
# "whatever crates.io serves today" and hands a third party the version choice.
# By the letter of the rule it also counts a path dependency with no `version`
# field. A path dependency (such as a fuzz harness pointing at the crate it
# fuzzes) resolves to source in this repository at this commit: no registry and
# no third party in the loop, so those are exempt. The suite's own crates come
# from git instead, pinned by the lockfile and admitted by `allow-git` under
# [sources].
allow-wildcard-paths = true

# Prefer the workspace-declared version of any crate that also appears deeper.
highlight = "all"

deny = [
  # Heavy TLS / crypto stacks — the suite runs behind Tor and needs none of them.
  { name = "openssl" },
  { name = "openssl-sys" },
  { name = "native-tls" },
  { name = "ring" },
  # In-process git — gitweb shells out to the git binary (argv-only) by design.
  { name = "git2" },
  { name = "libgit2-sys" },
]

# A hard allowlist is intentionally NOT enabled: turning `allow` on would make it
# exhaustive, so it would also have to enumerate every build-time proc-macro and
# per-platform shim above, and would churn on each toolchain bump. The intent is
# documented here and enforced structurally instead — the pure-core zero-dep gate
# in CI, plus `multiple-versions`/`wildcards`/`deny` — which together keep the set
# tiny without the maintenance cost. Uncomment and complete to make it strict:
# allow = [
#   { name = "tokio" },
#   { name = "getrandom" },
#   { name = "libc" },
#   { name = "mio" },
#   { name = "socket2" },
#   { name = "bytes" },
#   { name = "pin-project-lite" },
#   { name = "cfg-if" },
#   # ...plus wasi, windows-sys, windows-link, proc-macro2, quote, syn,
#   #    tokio-macros, unicode-ident.
# ]

# ── Sources — only the official crates.io registry ───────────────────────────
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# The suite's own crates, each in its repository.
allow-git = [
  "https://github.com/Vxmdzhb/crawlcore",
  "https://github.com/Vxmdzhb/gitweb",
  "https://github.com/Vxmdzhb/onioncrawler",
  "https://github.com/Vxmdzhb/suitedash",
  "https://github.com/Vxmdzhb/torrentds",
  "https://github.com/Vxmdzhb/websearch",
]
