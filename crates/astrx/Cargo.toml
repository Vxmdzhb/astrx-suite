[package]
name = "astrx"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/Vxmdzhb/astrx-suite"
# Not published to crates.io: the suite's crates depend on each other
# through their git repositories, and this also stops a stray `cargo publish`.
publish = false
description = "The single astrx entrypoint: dispatches to the five suite engines, plus `astrx doctor` for operator diagnostics."

# This crate only dispatches and diagnoses; it has no engine logic of its
# own. It depends on the five engine crates and calls each one's
# `cli::run(args)`, so `astrx gitweb --root /repos` and `gitweb --root /repos`
# run the same parser and print the same output.
#
# Still no third-party dependencies of its own: tokio and getrandom come in
# only through the engines' opt-in `net` and `rand` features. Versions aren't
# declared through `[workspace.dependencies]`, so the manifest parses on old
# Cargo (see the root Cargo.toml).
[dependencies]
crawlcore = { git = "https://github.com/Vxmdzhb/crawlcore", branch = "main", version = "0.1" }
gitweb = { git = "https://github.com/Vxmdzhb/gitweb", branch = "main", version = "0.1" }
onioncrawler = { git = "https://github.com/Vxmdzhb/onioncrawler", branch = "main", version = "0.1" }
suitedash = { git = "https://github.com/Vxmdzhb/suitedash", branch = "main", version = "0.1" }
torrentds = { git = "https://github.com/Vxmdzhb/torrentds", branch = "main", version = "0.1" }
websearch = { git = "https://github.com/Vxmdzhb/websearch", branch = "main", version = "0.1" }

# `net` fans out to every engine's `net` feature, because that is the tier in
# which each engine's `cli` module exists at all. There is deliberately no
# per-engine feature: an `astrx` that could dispatch to three of five engines
# would be worse than no `astrx`, since an operator cannot tell from the name
# which build they have.
[features]
default = []
# The engines' getrandom-backed entropy, forwarded so `--features rand` means
# the same here as in each engine (and the CI feature matrix applies to this
# crate on its own).
rand = [
    "gitweb/rand",
    "onioncrawler/rand",
    "suitedash/rand",
    "torrentds/rand",
    "websearch/rand",
]
net = [
    "gitweb/net",
    "onioncrawler/net",
    "suitedash/net",
    "torrentds/net",
    "websearch/net",
]

# The one binary the suite installs. Gated on `net` like every engine binary it
# dispatches to — without `net` the engines have no `cli` module to call.
[[bin]]
name = "astrx"
path = "src/bin/astrx.rs"
required-features = ["net"]
