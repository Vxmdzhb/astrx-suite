# CI for the suite, on every push and once a week.
#
# Runs install_rust_suite.sh --ci, plus what a laptop can't easily check: the
# build on the declared minimum Rust version, and the zero-dependency claim.
#
#   * Every job is `--locked`, so a lockfile out of date fails the build
#     instead of quietly resolving something new.
#   * The zero-dependency property is checked, not assumed: it is the
#     project's central claim.
name: astrx-suite

on:
  push:
  pull_request:
  # A RUSTSEC advisory can land on a week nobody pushes. Without this the
  # supply-chain check only ever runs when something else already changed.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

defaults:
  run:
    working-directory: .

env:
  CARGO_TERM_COLOR: always

  # The toolchain the lint bar is measured against: pinned, and raised by hand.
  #
  # With `-D warnings` on a floating stable, every new clippy release would
  # turn CI red on code that hasn't changed. `clippy-floating` below runs the
  # same lints on current stable without gating, so new lints arrive as a
  # report. When it shows findings: fix them, then raise this number.
  #
  # It has to be RUSTUP_TOOLCHAIN rather than the action's version argument:
  # rust-toolchain.toml pins channel = "stable", and rustup prefers that file
  # over whatever the action selected.
  LINT_TOOLCHAIN: '1.95.0'

  # NB: RUSTFLAGS is deliberately NOT set here. A workflow-level `-D warnings`
  # applies to DEPENDENCY compilation too, so a new warning inside tokio — code
  # this repository does not control and cannot fix — would break the build with
  # no change to the tree. Warnings are denied where they belong: on the clippy
  # invocations below, which are scoped to `--workspace`.

jobs:
  # ---------------------------------------------------------------- style
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned for the same reason as clippy: rustfmt's output is not frozen
      # across releases, so a floating toolchain can decide this repository is
      # misformatted on a day nobody touched it. Less volatile than clippy —
      # this job has never actually broken — but there is no reason for the two
      # halves of the style gate to be measured against different compilers.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check
        env: { RUSTUP_TOOLCHAIN: '${{ env.LINT_TOOLCHAIN }}' }

  # ------------------------------------------------- lints, every feature tier
  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The four tiers the crates actually ship. A lint clean only under
        # --all-features says nothing about the zero-dependency build, which is
        # the one most people will compile.
        features: ['--no-default-features', '', '--features rand', '--features net', '--all-features']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - name: Prove the lint bar is the pinned toolchain, not whatever stable is
        run: cargo clippy --version
        env: { RUSTUP_TOOLCHAIN: '${{ env.LINT_TOOLCHAIN }}' }
      - run: cargo clippy --workspace --all-targets --locked ${{ matrix.features }} -- -D warnings
        env: { RUSTUP_TOOLCHAIN: '${{ env.LINT_TOOLCHAIN }}' }

  # ------------------------------------ the same lints, on current stable
  #
  # An early warning that LINT_TOOLCHAIN has fallen behind. It reports what a
  # newer clippy flags; the fix is to address the findings and raise the pin.
  #
  # It doesn't go red for that: warnings stay warnings, findings become
  # annotations and a job summary, and the step exits 0. Code that no longer
  # compiles on new stable is a real failure, and that does exit non-zero.
  #
  # Two tiers cover every line between them: the zero-dependency build and the
  # full one.
  clippy-floating:
    name: clippy on current stable (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy }
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      # rust-toolchain.toml says channel = "stable", so this is already what
      # rustup would pick; naming it is what stops a future edit to that file
      # from quietly turning this job into a duplicate of the pinned one.
      - run: cargo clippy --version
        env: { RUSTUP_TOOLCHAIN: stable }

      - name: What current stable would say (reported, not enforced)
        env: { RUSTUP_TOOLCHAIN: stable }
        run: |
          set -uo pipefail
          ver=$(cargo clippy --version)
          # No `-D warnings`: the exit code must mean "did it compile", not
          # "does it have opinions". --message-format short gives one
          # file:line:col: level: message per finding, which is what an
          # annotation needs.
          out=$(cargo clippy --workspace --all-targets --locked \
                  ${{ matrix.features }} --message-format short 2>&1) || rc=$?
          rc=${rc:-0}
          printf '%s\n' "$out"

          findings=$(printf '%s\n' "$out" | grep -E '^[^ ]+:[0-9]+:[0-9]+: warning:' || true)
          n=$(printf '%s' "$findings" | grep -c . || true)

          {
            echo "## clippy on \`${ver}\` — \`${{ matrix.features }}\`"
            echo
            echo "Pinned lint toolchain: \`${LINT_TOOLCHAIN}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$n" -gt 0 ]; then
            echo "::notice::${n} lint finding(s) on ${ver} that the pinned ${LINT_TOOLCHAIN} does not report. Fix them, then raise LINT_TOOLCHAIN."
            # One annotation each, so the findings are readable from the run
            # summary without opening the log.
            printf '%s\n' "$findings" | while IFS= read -r line; do
              f=${line%%:*}; rest=${line#*:}
              l=${rest%%:*};  rest=${rest#*:}
              c=${rest%%:*};  msg=${rest#*: warning: }
              echo "::warning file=${f},line=${l},col=${c}::${msg}"
            done
            {
              echo "${n} finding(s):"
              echo '```'
              printf '%s\n' "$findings"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "no new lints on ${ver}"
            echo "No findings — \`LINT_TOOLCHAIN\` can be raised to this release." >> "$GITHUB_STEP_SUMMARY"
          fi

          # Lints are advisory; not compiling is not.
          if printf '%s\n' "$out" | grep -qE '^error(\[|:)'; then
            echo "::error::the workspace does not COMPILE on ${ver} — this is not a style opinion"
            exit "$rc"
          fi
          exit 0

  # ----------------------------------------------------------------- tests
  test:
    name: tests (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ['--no-default-features', '--all-features']
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      - run: cargo test --workspace --locked ${{ matrix.features }}

  # ------------------------------------------------------ the MSRV is a promise
  msrv:
    name: MSRV 1.89
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      # rust-toolchain.toml pins channel = "stable", which rustup prefers over the
      # toolchain an action installs, so the MSRV has to be forced with
      # RUSTUP_TOOLCHAIN, which wins over the file.
      - name: Prove the toolchain really is the MSRV
        run: rustc --version | tee /dev/stderr | grep -q '1\.89\.'
        env: { RUSTUP_TOOLCHAIN: '1.89.0' }
      # Build, not test: dev-dependencies and test harnesses may legitimately
      # want newer Rust than the shipped library does.
      - run: cargo build --workspace --locked --all-features
        env: { RUSTUP_TOOLCHAIN: '1.89.0' }

  # ------------------------------- the project's central claim, asserted not assumed
  zero-deps:
    name: zero third-party dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The member list is read from the manifest, so a new crate is covered
      # automatically.
      #
      # The filter matches the tree's `name v0.0.0` field against that list
      # exactly, so a third-party crate whose name merely contains a member's name
      # can't slip through.
      - name: Every crate resolves to nothing but first-party code by default
        run: |
          set -euo pipefail
          # Each member's [package] name, from its own manifest. Not from
          # `cargo metadata`: its JSON has a "name" on every target and dependency too,
          # which would also pick up every test binary.
          members=$(for f in crates/*/Cargo.toml; do
            [ -f "$f" ] || continue
            sed -n '/^\[package\]/,/^\[/ s/^name *= *"\([^"]*\)".*/\1/p' "$f"
          done | sort -u)
          # The `[ -f ]` guard is so an unmatched glob reaches THIS line instead
          # of dying inside sed under `set -e`: a gate that cannot find anything
          # to check should say that, not emit "No such file or directory".
          test -n "$members" || {
            echo "::error::no workspace members found under crates/ — this job checked nothing"
            exit 1
          }
          echo "workspace members: $(echo "$members" | tr '\n' ' ')"
          # The engines and crawlcore are git dependencies now, from the
          # suite's own repositories: first party too.
          org=$(awk -F'"' -v p='git+https://github.com/Vxmdzhb/' \
            '/^name = /{n=$2} /^source = /{ if (index($2, p) == 1) print n }' Cargo.lock)
          members=$(printf '%s\n%s\n' "$members" "$org" | sed '/^$/d' | sort -u)

          fail=0
          for c in $members; do
            # Capture the tree separately so a cargo failure is a failure. The
            # previous version piped straight into `grep -c . || true`, which
            # turned any cargo error into "0 third-party crates" — a gate that
            # reports success precisely when it could not run.
            tree=$(cargo tree -p "$c" --edges normal --locked --prefix none) \
              || { echo "::error::cargo tree failed for $c"; fail=1; continue; }
            # Compare the crate NAME column against the member list, not a
            # substring: `grep -v crawlcore` would also have waved through a
            # third-party crate called `crawlcore-anything`.
            third=$(printf '%s\n' "$tree" | tail -n +2 | awk 'NF {print $1}' | sort -u \
                    | grep -vxF "$members" || true)
            n=$(printf '%s\n' "$third" | grep -c . || true)
            if [ "$n" -ne 0 ]; then
              echo "::error::$c pulls $n third-party crate(s) in the default build: $(echo "$third" | tr '\n' ' ')"
              printf '%s\n' "$tree"
              fail=1
            else
              echo "$c: 0"
            fi
          done
          exit "$fail"

  # ------------------------------------------------ the shipped installer itself
  installer:
    name: install_rust_suite.sh --ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.LINT_TOOLCHAIN }}
          components: 'rustfmt, clippy'
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: . }
      # The script an operator is told to run. If it breaks, the documented
      # install path is broken, whatever the rest of this file says.
      #
      # `--ci` makes the script run clippy as a hard gate, so this job inherits
      # the floating-toolchain problem the pinned `clippy` job above exists to
      # avoid — and it did: it failed alongside all five clippy tiers on a tree
      # that passed locally. The SCRIPT stays unpinned, because an operator runs
      # it with whatever toolchain they have and that is the thing being tested;
      # the pin lives here, in the job, where reproducibility is the point.
      - run: bash install_rust_suite.sh --ci
        env: { RUSTUP_TOOLCHAIN: '${{ env.LINT_TOOLCHAIN }}' }

  # ------------------------------------------------------------- supply chain
  #
  # Split deliberately. `bans`, `licenses` and `sources` are decided entirely by
  # this repository's own lockfile and deny.toml, so they are reproducible and
  # they block. `advisories` reads a LIVE feed — a RUSTSEC advisory published
  # tomorrow would fail this build with no change to the tree, and blocking a
  # merge on someone else's publication schedule is how a red CI becomes
  # background noise people stop reading. It runs, it reports, it does not gate;
  # the scheduled run below is what surfaces a new advisory on a quiet day.
  deny:
    name: cargo-deny (bans, licenses, sources)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check bans licenses sources

  advisories:
    name: cargo-deny (advisories, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: Cargo.toml
          command: check advisories
