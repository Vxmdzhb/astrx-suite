# astrx-suite — assembles the suite's engines into the single `astrx` binary
# and deploys it. Each engine is a crate in a repository of its own, and so is
# crawlcore, the library they share:
#
#   crawlcore     https://github.com/Vxmdzhb/crawlcore
#   gitweb        https://github.com/Vxmdzhb/gitweb
#   onioncrawler  https://github.com/Vxmdzhb/onioncrawler
#   suitedash     https://github.com/Vxmdzhb/suitedash
#   torrentds     https://github.com/Vxmdzhb/torrentds
#   websearch     https://github.com/Vxmdzhb/websearch
#
# crates/astrx gets them as git dependencies; Cargo.lock pins the exact
# commit of each. To work on an engine and the suite together, point Cargo
# at a local checkout with a [patch] section, e.g. in .cargo/config.toml:
#   [patch.'https://github.com/Vxmdzhb/gitweb']
#   gitweb = { path = "../gitweb" }
#
# Manifests are written WITHOUT Cargo workspace-inheritance, so the workspace
# parses on old Cargo and a toolchain below the declared `rust-version` fails
# with a clear MSRV message.
[workspace]
resolver = "2"
members = ["crates/astrx"]

[profile.release]
opt-level = 3
lto = true
strip = true
codegen-units = 1
